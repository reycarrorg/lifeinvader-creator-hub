<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, Segoe UI, sans-serif; width: 320px; margin: 0; padding: 14px; background: #121022; color: #f5f3ff; }
    h2 { margin: 0 0 8px; font-size: 15px; color: #00e5ff; }
    h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #a39ec4; }
    .card { background: #1a1732; border: 1px solid rgba(130,112,210,.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #c4bfe0; margin-bottom: 4px; }
    .chk { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #fff; margin-bottom: 8px; cursor: pointer; }
    .chk input { width: auto; margin: 0; accent-color: #00e5ff; }
    input[type=text], input[type=password] { box-sizing: border-box; width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid rgba(130,112,210,.4); background: #0d0b1a; color: #fff; font-size: 12px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    button { flex: 1; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; background: #262146; color: #f5f3ff; }
    button.primary { background: linear-gradient(135deg, #ff2e93, #00e5ff); color: #fff; }
    p { margin: 8px 0 0; font-size: 11px; line-height: 1.4; color: #b8b2d8; }
  </style>
</head>
<body>
  <h2>⚡ Snapmatic Bridge</h2>
  <div class="card">
    <label class="chk"><input type="checkbox" id="dm-enabled" checked> Auto-sync TikTok Group DM (every 1 min)</label>
    <label for="dm-group">Group DM Name</label>
    <input id="dm-group" type="text" value="cj_4_prez's group">
    <div class="row">
      <button id="pin-dm" type="button">📌 Pin Tab</button>
      <button id="sync-dm" class="primary" type="button">⬇ Sync Now</button>
    </div>
    <p id="dm-status" role="status">Ready to watch your pinned TikTok Group DM tab.</p>
  </div>

  <details>
    <summary style="cursor:pointer;font-size:11px;color:#a39ec4;">Profile Analytics Pairing (optional)</summary>
    <div class="card" style="margin-top:8px;">
      <label for="token">64-char Pairing Code</label>
      <input id="token" type="password" autocomplete="off">
      <div class="row">
        <button id="save" class="primary" type="button">Connect</button>
        <button id="forget" type="button">Disconnect</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
